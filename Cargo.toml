reth-chain-state = { git = "https://github.com/mantle-xyz/reth", tag = "v1.9.3-mantle-arsia.1" }
reth-chainspec = { git = "https://github.com/mantle-xyz/reth", tag = "v1.9.3-mantle-arsia.1" }
reth-cli = { git = "https://github.com/mantle-xyz/reth", tag = "v1.9.3-mantle-arsia.1" }
reth-cli-commands = { git = "https://github.com/mantle-xyz/reth", tag = "v1.9.3-mantle-arsia.1" }
reth-cli-util = { git = "https://github.com/mantle-xyz/reth", tag = "v1.9.3-mantle-arsia.1" }
reth-db = { git = "https://github.com/mantle-xyz/reth", tag = "v1.9.3-mantle-arsia.1" }
reth-evm = { git = "https://github.com/mantle-xyz/reth", tag = "v1.9.3-mantle-arsia.1" }
