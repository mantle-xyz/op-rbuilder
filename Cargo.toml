reth-execution-types = { git = "https://github.com/mantle-xyz/reth", tag = "v1.9.3-mantle-arsia.1" }
reth-ipc = { git = "https://github.com/mantle-xyz/reth", tag = "v1.9.3-mantle-arsia.1" }
reth-metrics = { git = "https://github.com/mantle-xyz/reth", tag = "v1.9.3-mantle-arsia.1" }
reth-network-peers = { git = "https://github.com/mantle-xyz/reth", tag = "v1.9.3-mantle-arsia.1" }
reth-node-api = { git = "https://github.com/mantle-xyz/reth", tag = "v1.9.3-mantle-arsia.1" }
reth-node-builder = { git = "https://github.com/mantle-xyz/reth", tag = "v1.9.3-mantle-arsia.1" }
reth-node-core = { git = "https://github.com/mantle-xyz/reth", tag = "v1.9.3-mantle-arsia.1" }
