op-alloy-consensus = { git = "https://github.com/mantle-xyz/op-alloy", tag = "v2.2.0", default-features = false }
op-alloy-flz = { version = "0.13.1", default-features = false }
op-alloy-network = { git = "https://github.com/mantle-xyz/op-alloy", tag = "v2.2.0", default-features = false }
op-alloy-rpc-types = { git = "https://github.com/mantle-xyz/op-alloy", tag = "v2.2.0", default-features = false }
