reth-optimism-payload-builder = { git = "https://github.com/mantle-xyz/reth", tag = "v1.9.3-mantle-arsia.1" }
reth-optimism-primitives = { git = "https://github.com/mantle-xyz/reth", tag = "v1.9.3-mantle-arsia.1", default-features = false }
reth-optimism-rpc = { git = "https://github.com/mantle-xyz/reth", tag = "v1.9.3-mantle-arsia.1", features = ["client"] }
reth-optimism-txpool = { git = "https://github.com/mantle-xyz/reth", tag = "v1.9.3-mantle-arsia.1" }
# Mantle-specific hardforks crate (Skadi / Limb / Arsia)
reth-mantle-forks = { git = "https://github.com/mantle-xyz/reth", tag = "v1.9.3-mantle-arsia.1", default-features = false }

# revm (Mantle Arsia fork)
revm = { git = "https://github.com/mantle-xyz/revm", tag = "v2.2.2", features = ["std", "secp256k1", "optional_balance_check"], default-features = false }
op-revm = { git = "https://github.com/mantle-xyz/revm", tag = "v2.2.2", default-features = false }

