alloy-json-rpc = { version = "=1.7.3" }
alloy-network = { version = "=1.7.3" }
alloy-primitives = { version = "=1.4.1", default-features = false, features = ["map-foldhash"] }
alloy-provider = { version = "=1.7.3", features = ["ipc", "pubsub", "txpool-api", "engine-api"] }
alloy-rlp = "0.3.10"
alloy-rpc-types = { version = "=1.7.3" }
alloy-rpc-types-engine = { version = "=1.7.3", features = ["ssz"] }
alloy-rpc-types-eth = { version = "=1.7.3" }
