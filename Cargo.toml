# op-reth (Mantle Arsia fork — integrated into mantle-xyz/reth, not separate repo)
reth-optimism-chainspec = { git = "https://github.com/mantle-xyz/reth", tag = "v1.9.3-mantle-arsia.1", default-features = false }
reth-optimism-cli = { git = "https://github.com/mantle-xyz/reth", tag = "v1.9.3-mantle-arsia.1", default-features = false }
reth-optimism-consensus = { git = "https://github.com/mantle-xyz/reth", tag = "v1.9.3-mantle-arsia.1", default-features = false }
reth-optimism-evm = { git = "https://github.com/mantle-xyz/reth", tag = "v1.9.3-mantle-arsia.1", default-features = false }
reth-optimism-forks = { git = "https://github.com/mantle-xyz/reth", tag = "v1.9.3-mantle-arsia.1", default-features = false }
